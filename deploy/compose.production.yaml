name: rfq-marketplace

services:
  postgres:
    # pgvector image: the V3 migrations create the 'vector' extension (AddCompanyVaultAndVectorSearch).
    # NOTE: there is no pg17-alpine tag upstream; pg17 is the Debian variant (matches local compose.yaml).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      marketplace:
        ipv4_address: 172.28.0.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    image: ${API_IMAGE}
    entrypoint: ["/app/efbundle"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MarketplaceDatabase: ${MARKETPLACE_DATABASE_CONNECTION}
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      marketplace:
        ipv4_address: 172.28.0.5
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - tools

  api:
    image: ${API_IMAGE}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      API_ORIGIN_HOST: ${API_ORIGIN_HOST}
      AllowedHosts: ${API_ORIGIN_HOST}
      ConnectionStrings__MarketplaceDatabase: ${MARKETPLACE_DATABASE_CONNECTION}
      DataProtection__KeysPath: /var/lib/marketplace/data-protection-keys
      Frontend__Origin: ${FRONTEND_ORIGIN}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      AiIntake__Enabled: "true"
      AiIntake__Provider: ${AI_INTAKE_PROVIDER:-OpenAi}
      AiIntake__ApiKey: ${AI_INTAKE_API_KEY:-}
      AiIntake__Endpoint: ${AI_INTAKE_RESPONSES_ENDPOINT:-https://api.openai.com/v1/responses}
      AiIntake__Model: ${AI_INTAKE_MODEL:-gpt-5.6-luna}
      GooglePlaces__Enabled: "true"
      GooglePlaces__ApiKey: ${GOOGLE_PLACES_API_KEY:-}
      GooglePlaces__TextSearchEndpoint: ${GOOGLE_PLACES_TEXT_SEARCH_ENDPOINT:-https://places.googleapis.com/v1/places:searchText}
      GooglePlaces__NearbySearchEndpoint: ${GOOGLE_PLACES_NEARBY_SEARCH_ENDPOINT:-https://places.googleapis.com/v1/places:searchNearby}
      GooglePlaces__GeocodingEndpoint: ${GOOGLE_PLACES_GEOCODING_ENDPOINT:-https://maps.googleapis.com/maps/api/geocode/json}
      PasswordReset__ResetPageUrl: ${FRONTEND_ORIGIN}/reset-password
      EmailVerification__ConfirmationPageUrl: ${FRONTEND_ORIGIN}/verify-email
      Email__Enabled: ${EMAIL_ENABLED}
      Email__Host: ${EMAIL_HOST}
      Email__Port: ${EMAIL_PORT}
      Email__UseTls: ${EMAIL_USE_TLS}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS}
      Email__FromName: ${EMAIL_FROM_NAME}
      Email__ReplyToAddress: ${EMAIL_REPLY_TO_ADDRESS}
      # V3 — Anunțuri SEAP / Auto-bidding (all features are OFF by default; toggle here to enable live)
      Features__SeapIngestionEnabled: ${FEATURES_SEAP_INGESTION_ENABLED:-false}
      Features__AutoBiddingEnabled: ${FEATURES_AUTO_BIDDING_ENABLED:-false}
      Seap__Enabled: ${SEAP_ENABLED:-false}
      Seap__BaseUrl: ${SEAP_BASE_URL:-https://e-licitatie.ro}
      Seap__NoticesPath: ${SEAP_NOTICES_PATH:-api-pub/NoticeCommon/GetCNoticeList/}
      Seap__NoticeTypeIds__0: ${SEAP_NOTICE_TYPE_ID:-2}
      Seap__NoticesPageSize: ${SEAP_NOTICES_PAGE_SIZE:-20}
      Seap__PollingIntervalSeconds: ${SEAP_POLLING_INTERVAL_SECONDS:-3600}
      Seap__TargetCpvPrefixes__0: ${SEAP_TARGET_CPV_PREFIX:-}
      Seap__MaxNoticesPerPoll: ${SEAP_MAX_NOTICES_PER_POLL:-20}
      Seap__MaxNewNoticesPerHour: ${SEAP_MAX_NEW_NOTICES_PER_HOUR:-5}
      Seap__RequestTimeoutSeconds: ${SEAP_REQUEST_TIMEOUT_SECONDS:-60}
      Seap__Storage__Enabled: ${SEAP_STORAGE_ENABLED:-false}
      Seap__Storage__Bucket: ${SEAP_STORAGE_BUCKET:-}
      Seap__Storage__Region: ${SEAP_STORAGE_REGION:-eu-central-1}
      AutoBidding__IsShadowMode: ${AUTO_BIDDING_IS_SHADOW_MODE:-false}
      AutoBidding__Model: ${AUTO_BIDDING_MODEL:-claude-3-5-sonnet}
      AutoBidding__ApiKey: ${AUTO_BIDDING_API_KEY:-}
      AutoBidding__ApiUrl: ${AUTO_BIDDING_API_URL:-https://api.anthropic.com/v1/messages}
      AutoBidding__MaxRequestTokens: ${AUTO_BIDDING_MAX_REQUEST_TOKENS:-8000}
      AutoBidding__TopChunks: ${AUTO_BIDDING_TOP_CHUNKS:-10}
      AutoBidding__EmbeddingModel: ${AUTO_BIDDING_EMBEDDING_MODEL:-text-embedding-3-small}
      AutoBidding__EmbeddingEndpoint: ${AUTO_BIDDING_EMBEDDING_ENDPOINT:-https://api.openai.com/v1/embeddings}
      AutoBidding__EmbeddingApiKey: ${AUTO_BIDDING_EMBEDDING_API_KEY:-}
      AutoBidding__DocumentsBucket: ${AUTO_BIDDING_DOCUMENTS_BUCKET:-}
      AutoBidding__DocumentsRegion: ${AUTO_BIDDING_DOCUMENTS_REGION:-eu-central-1}
      Stripe__Enabled: ${STRIPE_ENABLED:-false}
      Stripe__ApiKey: ${STRIPE_API_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__SuccessUrl: ${FRONTEND_ORIGIN}/seap/tenders
      Stripe__CancelUrl: ${FRONTEND_ORIGIN}/seap/tenders
      DocumentIntelligence__Enabled: ${DOCUMENT_INTELLIGENCE_ENABLED:-false}
      DocumentIntelligence__Endpoint: ${DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      DocumentIntelligence__ApiKey: ${DOCUMENT_INTELLIGENCE_API_KEY:-}
      ReverseProxy__KnownProxies__0: 172.28.0.2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      marketplace:
        ipv4_address: 172.28.0.3
    volumes:
      - ${DATA_PROTECTION_KEYS_PATH:-./.data-protection-keys}:/var/lib/marketplace/data-protection-keys
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --header \"Host: $${API_ORIGIN_HOST}\" http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_ORIGIN_HOST: ${API_ORIGIN_HOST}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      marketplace:
        ipv4_address: 172.28.0.2
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  marketplace:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
