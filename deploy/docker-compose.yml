name: rfq-marketplace

# Single-host dual-environment topology (cost-optimized, < $10/month):
#   - ONE PostgreSQL 17 + pgvector instance with two isolated databases:
#       compaspot_prod (Prod, public)  and  compaspot_staging (Staging, internal/testing only).
#   - backend-prod / backend-staging: two parallel API sets, isolated by DB, S3 root prefix and
#     feature flags, sharing the SAME API credentials (see the environment addendum).
#   - Caddy: reverse proxy + automatic Let's Encrypt TLS for the public Prod domain and an
#     internal-only HTTP site for Staging (:8081, reachable only from the admin CIDR).
#   - Frontend: the built Angular SPA is served by Caddy from ../shared/frontend-{prod,staging}
#     (uploaded by the deploy pipeline); no CloudFront/S3 is needed.
#
# Compose interpolation file .env holds shared values (API_IMAGE, POSTGRES_USER/PASSWORD, ACME_EMAIL,
# PROD_SITE). Backend container environments come from env_file .env.prod / .env.staging (rendered by
# deploy/scripts/render-environment.sh from AWS SSM).

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: compaspot_prod
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      marketplace:
        ipv4_address: 172.28.0.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # One-shot: creates compaspot_prod + compaspot_staging if missing (idempotent).
  init-db:
    image: pgvector/pgvector:pg17
    entrypoint: ["/bin/bash", "/scripts/init-databases.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/init-databases.sh:/scripts/init-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      marketplace:
        ipv4_address: 172.28.0.8
    profiles:
      - tools
    restart: "no"

  migrate-prod:
    image: ${API_IMAGE}
    entrypoint: ["/app/efbundle"]
    env_file: .env.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      marketplace:
        ipv4_address: 172.28.0.5
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - tools
    restart: "no"

  migrate-staging:
    image: ${API_IMAGE}
    entrypoint: ["/app/efbundle"]
    env_file: .env.staging
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      marketplace:
        ipv4_address: 172.28.0.9
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - tools
    restart: "no"
  backend-prod:
    image: ${API_IMAGE}
    env_file: .env.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      marketplace:
        ipv4_address: 172.28.0.3
    volumes:
      - ../shared/data-protection-keys-prod:/var/lib/marketplace/data-protection-keys
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --header \"Host: $${API_ORIGIN_HOST}\" http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend-staging:
    image: ${API_IMAGE}
    env_file: .env.staging
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      marketplace:
        ipv4_address: 172.28.0.6
    volumes:
      - ../shared/data-protection-keys-staging:/var/lib/marketplace/data-protection-keys
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      PROD_SITE: ${PROD_SITE:-compaspot.com}
    depends_on:
      backend-prod:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../shared/frontend-prod:/srv/www-prod:ro
      - ../shared/frontend-staging:/srv/www-staging:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      marketplace:
        ipv4_address: 172.28.0.2
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  marketplace:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
