name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to deploy
        required: true
        type: choice
        default: production
        options:
          - production
          - staging
# Single-host dual-environment topology (Prod + Staging) — see deploy/docker-compose.yml and
# docs/operations/environments.md. Prod is public on compaspot.com; Staging is internal-only
# (Lightsail static IP :8081, firewall restricted to the admin CIDR). Both environments share the
# same API credentials; isolation is by database, S3 root prefix and feature flags.

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PARAMETER_PATH: /rfq-marketplace/${{ inputs.environment }}
      RELEASE_ID: ${{ github.sha }}
      API_IMAGE: rfq-marketplace-api:${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Load deployment configuration
        id: config
        shell: bash
        run: |
          set -Eeuo pipefail
          get_parameter() {
            aws ssm get-parameter \
              --name "${PARAMETER_PATH}/$1" \
              --query Parameter.Value \
              --output text
          }
          {
            echo "instance_name=$(get_parameter instance-name)"
            echo "backups_bucket=$(get_parameter backups-bucket)"
            echo "admin_cidr=$(get_parameter admin-cidr)"
          } >> "$GITHUB_OUTPUT"

      - name: Render environment files
        run: bash deploy/scripts/render-environment.sh "$PARAMETER_PATH" "$API_IMAGE" .deployment

      - name: Build Angular
        working-directory: src/marketplace-web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package frontend
        run: |
          tar -C src/marketplace-web/dist/marketplace-web/browser -czf frontend.tar.gz .

      - name: Build API image
        run: |
          docker build --file src/Marketplace.Api/Dockerfile --tag "$API_IMAGE" .
          docker save "$API_IMAGE" | gzip --best > api-image.tar.gz

      - name: Open temporary SSH access
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_ip="$(curl --fail --silent --show-error https://checkip.amazonaws.com | tr -d '[:space:]')"
          instance_ip="$(aws lightsail get-instance \
            --instance-name '${{ steps.config.outputs.instance_name }}' \
            --query instance.publicIpAddress \
            --output text)"
          cat > /tmp/ports.json <<JSON
          [
            {"fromPort":22,"toPort":22,"protocol":"tcp","cidrs":["${runner_ip}/32"]},
            {"fromPort":80,"toPort":80,"protocol":"tcp","cidrs":["0.0.0.0/0"]},
            {"fromPort":443,"toPort":443,"protocol":"tcp","cidrs":["0.0.0.0/0"]},
            {"fromPort":443,"toPort":443,"protocol":"udp","cidrs":["0.0.0.0/0"]},
            {"fromPort":8081,"toPort":8081,"protocol":"tcp","cidrs":["${runner_ip}/32"]}
          ]
          JSON
          aws lightsail put-instance-public-ports \
            --instance-name '${{ steps.config.outputs.instance_name }}' \
            --port-infos file:///tmp/ports.json

          access_details="$(aws lightsail get-instance-access-details \
            --instance-name '${{ steps.config.outputs.instance_name }}' \
            --protocol ssh \
            --output json)"
          jq --raw-output '.accessDetails.privateKey' <<< "$access_details" > /tmp/lightsail-key
          jq --raw-output '.accessDetails.certKey' <<< "$access_details" > /tmp/lightsail-key-cert.pub
          chmod 600 /tmp/lightsail-key /tmp/lightsail-key-cert.pub
          mkdir -p ~/.ssh
          username="$(jq --raw-output '.accessDetails.username' <<< "$access_details")"
          unset access_details

          for attempt in {1..18}; do
            if ssh-keyscan -T 5 -H "$instance_ip" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "SSH readiness attempt ${attempt}/18 has not passed yet."
            sleep 5
          done

          echo "instance_ip=$instance_ip" >> "$GITHUB_OUTPUT"
          echo "username=$username" >> "$GITHUB_OUTPUT"

      - name: Upload release
        shell: bash
        run: |
          set -Eeuo pipefail
          destination="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.instance_ip }}"
          ssh -i /tmp/lightsail-key "$destination" \
            "mkdir -p /opt/rfq-marketplace/releases/${RELEASE_ID}/scripts"
          scp -i /tmp/lightsail-key \
            deploy/docker-compose.yml \
            deploy/Caddyfile \
            .deployment/.env \
            .deployment/.env.prod \
            .deployment/.env.staging \
            api-image.tar.gz \
            frontend.tar.gz \
            "$destination:/opt/rfq-marketplace/releases/${RELEASE_ID}/"
          scp -i /tmp/lightsail-key deploy/scripts/*.sh \
            "$destination:/opt/rfq-marketplace/releases/${RELEASE_ID}/scripts/"
          ssh -i /tmp/lightsail-key "$destination" \
            "chmod 600 /opt/rfq-marketplace/releases/${RELEASE_ID}/.env \
              /opt/rfq-marketplace/releases/${RELEASE_ID}/.env.prod \
              /opt/rfq-marketplace/releases/${RELEASE_ID}/.env.staging \
             && chmod +x /opt/rfq-marketplace/releases/${RELEASE_ID}/scripts/*.sh"

      - name: Back up databases off-instance
        shell: bash
        run: |
          set -Eeuo pipefail
          destination="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.instance_ip }}"
          backup_paths="$(ssh -i /tmp/lightsail-key "$destination" \
            '/opt/rfq-marketplace/releases/${{ github.sha }}/scripts/database-backup.sh')"
          if [[ "$backup_paths" != "FIRST_DEPLOYMENT" ]]; then
            while IFS= read -r backup_path; do
              [[ -z "$backup_path" ]] && continue
              scp -i /tmp/lightsail-key \
                "$destination:$backup_path" \
                "$destination:${backup_path}.sha256" \
                /tmp/
              (
                cd /tmp
                sha256sum --check "$(basename "${backup_path}.sha256")"
              )
              aws s3 cp "/tmp/$(basename "$backup_path")" \
                "s3://${{ steps.config.outputs.backups_bucket }}/database/$(basename "$backup_path")" \
                --sse AES256
              aws s3 cp "/tmp/$(basename "${backup_path}.sha256")" \
                "s3://${{ steps.config.outputs.backups_bucket }}/database/$(basename "${backup_path}.sha256")" \
                --sse AES256
            done <<< "$backup_paths"
          fi


      - name: Deploy release
        shell: bash
        run: |
          destination="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.instance_ip }}"
          ssh -i /tmp/lightsail-key "$destination" \
            "/opt/rfq-marketplace/releases/${RELEASE_ID}/scripts/host-deploy.sh \
             ${RELEASE_ID} \
             /opt/rfq-marketplace/releases/${RELEASE_ID}/api-image.tar.gz \
             /opt/rfq-marketplace/releases/${RELEASE_ID}/frontend.tar.gz"

      - name: Verify deployed application
        shell: bash
        run: |
          set -Eeuo pipefail
          instance_ip='${{ steps.ssh.outputs.instance_ip }}'
          probe() {
            local label="$1" url="$2" host_header="${3:-}"
            local out code
            if [[ -n "${host_header}" ]]; then
              out="$(curl --silent --show-error --max-time 10 -H "Host: ${host_header}" -w $'\n%{http_code}' "${url}" 2>&1 || true)"
            else
              out="$(curl --silent --show-error --max-time 10 -w $'\n%{http_code}' "${url}" 2>&1 || true)"
            fi
            code="${out##*$'\n'}"
            echo "[${label}] HTTP ${code} :: $(printf '%s' "${out}" | head -c 160)"
          }
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --max-time 10 -H "Host: compaspot.com" "http://${instance_ip}/health/ready" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 -H "Host: compaspot.com" "http://${instance_ip}/" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 "http://${instance_ip}:8081/health/ready" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 "http://${instance_ip}:8081/" >/dev/null; then
              echo "Deployment verified: Prod (compaspot.com via Caddy) and Staging (:8081)."
              exit 0
            fi
            echo "Verification attempt ${attempt}/24 has not passed yet."
            probe "prod /health/ready" "http://${instance_ip}/health/ready" "compaspot.com"
            probe "prod /" "http://${instance_ip}/" "compaspot.com"
            probe "staging /health/ready" "http://${instance_ip}:8081/health/ready"
            probe "staging /" "http://${instance_ip}:8081/"
            sleep 10
          done
          echo "Deployment did not pass readiness within four minutes." >&2
          exit 1

      # Last verification step after every Staging deployment: the Playwright smoke suite
      # signs in with the test account and validates the live SEAP search (SEAP connectivity
      # + PostgreSQL reads). Requires repo/org secrets E2E_TEST_EMAIL and E2E_TEST_PASSWORD.
      # Port 8081 is already open to the runner IP for the duration of this job.
      - name: Run Staging smoke tests (Playwright E2E)
        if: inputs.environment == 'staging' && success()
        working-directory: src/marketplace-web
        env:
          STAGING_URL: http://${{ steps.ssh.outputs.instance_ip }}:8081
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e:staging

      - name: Restore restricted SSH access
        if: always() && steps.config.outputs.instance_name != ''
        shell: bash
        run: |
          cat > /tmp/ports-restricted.json <<JSON
          [
            {"fromPort":22,"toPort":22,"protocol":"tcp","cidrs":["${{ steps.config.outputs.admin_cidr }}"]},
            {"fromPort":80,"toPort":80,"protocol":"tcp","cidrs":["0.0.0.0/0"]},
            {"fromPort":443,"toPort":443,"protocol":"tcp","cidrs":["0.0.0.0/0"]},
            {"fromPort":443,"toPort":443,"protocol":"udp","cidrs":["0.0.0.0/0"]},
            {"fromPort":8081,"toPort":8081,"protocol":"tcp","cidrs":["${{ steps.config.outputs.admin_cidr }}"]}
          ]
          JSON
          aws lightsail put-instance-public-ports \
            --instance-name '${{ steps.config.outputs.instance_name }}' \
            --port-infos file:///tmp/ports-restricted.json
          rm -f /tmp/lightsail-key /tmp/lightsail-key-cert.pub
          rm -rf .deployment frontend.tar.gz api-image.tar.gz
