name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PARAMETER_PATH: /rfq-marketplace/${{ inputs.environment }}
      RELEASE_ID: ${{ github.sha }}
      API_IMAGE: rfq-marketplace-api:${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Load deployment configuration
        id: config
        shell: bash
        run: |
          set -Eeuo pipefail
          get_parameter() {
            aws ssm get-parameter \
              --name "${PARAMETER_PATH}/$1" \
              --query Parameter.Value \
              --output text
          }
          {
            echo "instance_name=$(get_parameter instance-name)"
            echo "frontend_bucket=$(get_parameter frontend-bucket)"
            echo "backups_bucket=$(get_parameter backups-bucket)"
            echo "distribution_id=$(get_parameter cloudfront-distribution-id)"
            echo "frontend_origin=$(get_parameter frontend-origin)"
            echo "admin_cidr=$(get_parameter admin-cidr)"
          } >> "$GITHUB_OUTPUT"

      - name: Render production environment
        run: bash deploy/scripts/render-environment.sh "$PARAMETER_PATH" "$API_IMAGE" .deployment.env

      - name: Build Angular
        working-directory: src/marketplace-web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build API image
        run: |
          docker build --file src/Marketplace.Api/Dockerfile --tag "$API_IMAGE" .
          docker save "$API_IMAGE" | gzip --best > api-image.tar.gz

      - name: Open temporary SSH access
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_ip="$(curl --fail --silent --show-error https://checkip.amazonaws.com | tr -d '[:space:]')"
          instance_ip="$(aws lightsail get-instance \
            --instance-name '${{ steps.config.outputs.instance_name }}' \
            --query instance.publicIpAddress \
            --output text)"
          cat > /tmp/ports.json <<JSON
          [
            {"fromPort":22,"toPort":22,"protocol":"tcp","cidrs":["${runner_ip}/32"]},
            {"fromPort":80,"toPort":80,"protocol":"tcp","cidrs":["0.0.0.0/0"]},
            {"fromPort":443,"toPort":443,"protocol":"tcp","cidrs":["0.0.0.0/0"]},
            {"fromPort":443,"toPort":443,"protocol":"udp","cidrs":["0.0.0.0/0"]}
          ]
          JSON
          aws lightsail put-instance-public-ports \
            --instance-name '${{ steps.config.outputs.instance_name }}' \
            --port-infos file:///tmp/ports.json

          access_details="$(aws lightsail get-instance-access-details \
            --instance-name '${{ steps.config.outputs.instance_name }}' \
            --protocol ssh \
            --output json)"
          jq --raw-output '.accessDetails.privateKey' <<< "$access_details" > /tmp/lightsail-key
          jq --raw-output '.accessDetails.certKey' <<< "$access_details" > /tmp/lightsail-key-cert.pub
          chmod 600 /tmp/lightsail-key /tmp/lightsail-key-cert.pub
          mkdir -p ~/.ssh
          username="$(jq --raw-output '.accessDetails.username' <<< "$access_details")"
          unset access_details

          for attempt in {1..18}; do
            if ssh-keyscan -T 5 -H "$instance_ip" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "SSH readiness attempt ${attempt}/18 has not passed yet."
            sleep 5
          done

          echo "instance_ip=$instance_ip" >> "$GITHUB_OUTPUT"
          echo "username=$username" >> "$GITHUB_OUTPUT"

      - name: Upload release
        shell: bash
        run: |
          set -Eeuo pipefail
          destination="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.instance_ip }}"
          ssh -i /tmp/lightsail-key "$destination" \
            "mkdir -p /opt/rfq-marketplace/releases/${RELEASE_ID}/scripts"
          scp -i /tmp/lightsail-key \
            deploy/compose.production.yaml \
            deploy/Caddyfile \
            .deployment.env \
            api-image.tar.gz \
            "$destination:/opt/rfq-marketplace/releases/${RELEASE_ID}/"
          scp -i /tmp/lightsail-key deploy/scripts/*.sh \
            "$destination:/opt/rfq-marketplace/releases/${RELEASE_ID}/scripts/"
          ssh -i /tmp/lightsail-key "$destination" \
            "mv /opt/rfq-marketplace/releases/${RELEASE_ID}/.deployment.env /opt/rfq-marketplace/releases/${RELEASE_ID}/.env \
             && chmod 600 /opt/rfq-marketplace/releases/${RELEASE_ID}/.env \
             && chmod +x /opt/rfq-marketplace/releases/${RELEASE_ID}/scripts/*.sh"

      - name: Back up database off-instance
        shell: bash
        run: |
          set -Eeuo pipefail
          destination="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.instance_ip }}"
          backup_path="$(ssh -i /tmp/lightsail-key "$destination" \
            '/opt/rfq-marketplace/releases/${{ github.sha }}/scripts/database-backup.sh')"
          if [[ "$backup_path" != "FIRST_DEPLOYMENT" ]]; then
            scp -i /tmp/lightsail-key \
              "$destination:$backup_path" \
              "$destination:${backup_path}.sha256" \
              /tmp/
            (
              cd /tmp
              sha256sum --check "$(basename "${backup_path}.sha256")"
            )
            aws s3 cp "/tmp/$(basename "$backup_path")" \
              "s3://${{ steps.config.outputs.backups_bucket }}/database/$(basename "$backup_path")" \
              --sse AES256
            aws s3 cp "/tmp/$(basename "${backup_path}.sha256")" \
              "s3://${{ steps.config.outputs.backups_bucket }}/database/$(basename "${backup_path}.sha256")" \
              --sse AES256
          fi

      - name: Deploy API release
        shell: bash
        run: |
          destination="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.instance_ip }}"
          ssh -i /tmp/lightsail-key "$destination" \
            "/opt/rfq-marketplace/releases/${RELEASE_ID}/scripts/host-deploy.sh \
             ${RELEASE_ID} \
             /opt/rfq-marketplace/releases/${RELEASE_ID}/api-image.tar.gz"

      - name: Publish frontend
        shell: bash
        run: |
          frontend_dir="src/marketplace-web/dist/marketplace-web/browser"
          aws s3 sync "$frontend_dir/" "s3://${{ steps.config.outputs.frontend_bucket }}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$frontend_dir/index.html" \
            "s3://${{ steps.config.outputs.frontend_bucket }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
          aws cloudfront create-invalidation \
            --distribution-id '${{ steps.config.outputs.distribution_id }}' \
            --paths '/*'

      - name: Verify deployed application
        shell: bash
        run: |
          set -Eeuo pipefail
          origin='${{ steps.config.outputs.frontend_origin }}'
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "${origin}/health/ready" >/dev/null \
              && curl --fail --silent --show-error "${origin}/" >/dev/null; then
              echo "Deployment verified at ${origin}"
              exit 0
            fi
            echo "CloudFront verification attempt ${attempt}/24 has not passed yet."
            sleep 10
          done
          echo "CloudFront deployment did not pass readiness within four minutes." >&2
          exit 1

      - name: Restore restricted SSH access
        if: always() && steps.config.outputs.instance_name != ''
        shell: bash
        run: |
          cat > /tmp/ports-restricted.json <<JSON
          [
            {"fromPort":22,"toPort":22,"protocol":"tcp","cidrs":["${{ steps.config.outputs.admin_cidr }}"]},
            {"fromPort":80,"toPort":80,"protocol":"tcp","cidrs":["0.0.0.0/0"]},
            {"fromPort":443,"toPort":443,"protocol":"tcp","cidrs":["0.0.0.0/0"]},
            {"fromPort":443,"toPort":443,"protocol":"udp","cidrs":["0.0.0.0/0"]}
          ]
          JSON
          aws lightsail put-instance-public-ports \
            --instance-name '${{ steps.config.outputs.instance_name }}' \
            --port-infos file:///tmp/ports-restricted.json
          rm -f /tmp/lightsail-key /tmp/lightsail-key-cert.pub .deployment.env
