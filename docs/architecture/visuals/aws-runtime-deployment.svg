<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">RFQ Marketplace AWS runtime deployment</title>
  <desc id="desc">AWS-style deployment view showing same-origin CloudFront routing to S3 for the frontend and to a Lightsail Caddy origin for API paths, with PostgreSQL, Parameter Store, SES, optional future attachment storage, and backups.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:32px;font-weight:700}.subtitle{font-size:17px;fill:#5c667a}
      .boundary{fill:#f7f8fa;stroke:#87909f;stroke-width:2}.group{fill:#fff;stroke:#c6cad1;stroke-width:2}
      .service{fill:#fff;stroke-width:3}.edge{stroke:#8c4fff}.compute{stroke:#ed7100}.storage{stroke:#3f8624}.security{stroke:#dd344c}.delivery{stroke:#147eba}
      .name{font-size:19px;font-weight:700;text-anchor:middle}.detail{font-size:15px;fill:#5c667a;text-anchor:middle}
      .label{font-size:18px;font-weight:700}.arrow{fill:none;stroke:#4f596a;stroke-width:3;marker-end:url(#arrow)}
      .arrow-public{stroke:#8c4fff}.arrow-private{stroke:#dd344c;stroke-dasharray:8 6}.note{font-size:14px;fill:#5c667a}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f596a"/></marker>
  </defs>
  <rect width="1600" height="950" fill="#ffffff"/>
  <text class="title" x="60" y="62">RFQ Marketplace — AWS Runtime Deployment</text>
  <text class="subtitle" x="60" y="94">Low-cost MVP · same-origin browser routing · one API process · one PostgreSQL database</text>

  <rect class="boundary" x="220" y="125" width="1320" height="750" rx="20"/>
  <text class="label" x="250" y="162">AWS account · selected European region</text>

  <rect class="group" x="260" y="195" width="420" height="260" rx="18"/>
  <text class="label" x="290" y="230">Static frontend delivery</text>

  <rect class="group" x="735" y="195" width="750" height="390" rx="18"/>
  <text class="label" x="765" y="230">Amazon Lightsail instance</text>

  <rect class="service edge" x="38" y="365" width="145" height="100" rx="14"/>
  <text class="name" x="110" y="407">Users</text><text class="detail" x="110" y="437">Web browsers</text>

  <rect class="service edge" x="295" y="270" width="150" height="100" rx="14"/>
  <text class="name" x="370" y="312">Route 53</text><text class="detail" x="370" y="342">DNS routing</text>

  <rect class="service edge" x="490" y="270" width="155" height="100" rx="14"/>
  <text class="name" x="567" y="312">CloudFront</text><text class="detail" x="567" y="342">HTTPS + CDN</text>

  <rect class="service storage" x="390" y="390" width="165" height="50" rx="12"/>
  <text class="name" x="472" y="422">Frontend S3</text>

  <rect class="service compute" x="780" y="285" width="165" height="100" rx="14"/>
  <text class="name" x="862" y="327">Caddy</text><text class="detail" x="862" y="357">TLS reverse proxy</text>

  <rect class="service compute" x="1020" y="285" width="205" height="100" rx="14"/>
  <text class="name" x="1122" y="327">ASP.NET Core API</text><text class="detail" x="1122" y="357">Modular monolith</text>

  <rect class="service storage" x="1020" y="445" width="205" height="100" rx="14"/>
  <text class="name" x="1122" y="487">PostgreSQL</text><text class="detail" x="1122" y="517">Named persistent volume</text>

  <rect class="service storage" x="285" y="660" width="205" height="100" rx="14"/>
  <text class="name" x="387" y="702">Attachments S3</text><text class="detail" x="387" y="732">Post-MVP · private</text>

  <rect class="service security" x="555" y="660" width="205" height="100" rx="14"/>
  <text class="name" x="657" y="702">Parameter Store</text><text class="detail" x="657" y="732">Secrets + configuration</text>

  <rect class="service delivery" x="825" y="660" width="205" height="100" rx="14"/>
  <text class="name" x="927" y="702">Amazon SES</text><text class="detail" x="927" y="732">Transactional email</text>

  <rect class="service storage" x="1095" y="660" width="245" height="100" rx="14"/>
  <text class="name" x="1217" y="702">Encrypted backups</text><text class="detail" x="1217" y="732">Off-instance recovery</text>

  <path class="arrow arrow-public" d="M183 392C235 350 255 330 295 322"/>
  <path class="arrow arrow-public" d="M445 320H490"/>
  <path class="arrow" d="M567 370L500 390"/>
  <path class="arrow arrow-public" d="M645 335H780"/>
  <path class="arrow" d="M945 335H1020"/>
  <path class="arrow" d="M1122 385V445"/>
  <path class="arrow" d="M1065 385C850 500 580 555 407 660"/>
  <path class="arrow arrow-private" d="M1090 385C935 510 750 565 667 660"/>
  <path class="arrow" d="M1150 385C1130 505 1015 575 945 660"/>
  <path class="arrow" d="M1150 545C1170 590 1195 620 1210 660"/>

  <text class="note" x="211" y="365">HTTPS</text>
  <text class="note" x="610" y="315">app.example.com</text>
  <text class="note" x="660" y="315">/api/* + /health/*</text>
  <text class="note" x="660" y="355">api-origin.example.com</text>
  <text class="note" x="720" y="905">Public browser entry point: CloudFront · Caddy accepts origin traffic · PostgreSQL and API ports remain private</text>
</svg>
