<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">Angular frontend C4 component overview</title>
  <desc id="description">A layered view showing the browser, Angular application shell, feature components, core services, HTTP pipeline, and ASP.NET Core API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52635b"/>
    </marker>
    <style>
      .canvas{fill:#f7f9f8}.boundary{fill:#fff;stroke:#176b52;stroke-width:3}.group{fill:#f1f6f3;stroke:#a9bbb2;stroke-width:2}
      .feature{fill:#eaf1fb;stroke:#7392b7;stroke-width:2}.core{fill:#e8f4ed;stroke:#4f8f75;stroke-width:2}
      .cross{fill:#fff4d6;stroke:#b48a2d;stroke-width:2}.external{fill:#172033;stroke:#172033;stroke-width:2}
      .title{font:700 28px Arial,sans-serif;fill:#172033}.subtitle{font:400 16px Arial,sans-serif;fill:#52635b}
      .label{font:700 17px Arial,sans-serif;fill:#172033}.small{font:400 14px Arial,sans-serif;fill:#52635b}
      .inverse{font:700 17px Arial,sans-serif;fill:#fff}.inverseSmall{font:400 14px Arial,sans-serif;fill:#e8edf2}
      .groupLabel{font:700 16px Arial,sans-serif;fill:#176b52;letter-spacing:.5px}.line{fill:none;stroke:#52635b;stroke-width:2.2;marker-end:url(#arrow)}
      .dashed{fill:none;stroke:#7a6950;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="960"/>
  <text class="title" x="70" y="58">Angular SPA — component view</text>
  <text class="subtitle" x="70" y="86">Current MVP implementation · routed experiences, shared state, and backend resilience</text>

  <rect class="external" x="38" y="405" width="150" height="100" rx="16"/>
  <text class="inverse" x="113" y="444" text-anchor="middle">Buyer / Provider</text>
  <text class="inverseSmall" x="113" y="470" text-anchor="middle">Web browser</text>

  <rect class="boundary" x="225" y="110" width="1125" height="760" rx="24"/>
  <text class="groupLabel" x="255" y="146">ANGULAR SPA</text>

  <rect class="group" x="275" y="175" width="1025" height="105" rx="18"/>
  <text class="label" x="315" y="213">Application shell</text>
  <text class="small" x="315" y="239">Header · navigation · router outlet · global service-status alert</text>
  <rect class="core" x="965" y="195" width="290" height="64" rx="12"/>
  <text class="label" x="1110" y="223" text-anchor="middle">Notification menu</text>
  <text class="small" x="1110" y="246" text-anchor="middle">Unread polling and actions</text>

  <rect class="group" x="275" y="315" width="1025" height="275" rx="18"/>
  <text class="groupLabel" x="305" y="348">FEATURE COMPONENTS</text>

  <rect class="feature" x="310" y="375" width="285" height="78" rx="12"/>
  <text class="label" x="452" y="405" text-anchor="middle">Identity</text>
  <text class="small" x="452" y="430" text-anchor="middle">Sign in · registration</text>

  <rect class="feature" x="645" y="375" width="285" height="78" rx="12"/>
  <text class="label" x="787" y="405" text-anchor="middle">Piața Live &amp; discovery</text>
  <text class="small" x="787" y="430" text-anchor="middle">Market · participants · open RFQs</text>

  <rect class="feature" x="980" y="375" width="285" height="78" rx="12"/>
  <text class="label" x="1122" y="405" text-anchor="middle">Account workspace</text>
  <text class="small" x="1122" y="430" text-anchor="middle">Role switch · profiles · settings</text>

  <rect class="feature" x="310" y="480" width="285" height="78" rx="12"/>
  <text class="label" x="452" y="510" text-anchor="middle">Request workflow</text>
  <text class="small" x="452" y="535" text-anchor="middle">Buyer list · intake · create and edit</text>

  <rect class="feature" x="645" y="480" width="285" height="78" rx="12"/>
  <text class="label" x="787" y="510" text-anchor="middle">Offer workflow</text>
  <text class="small" x="787" y="535" text-anchor="middle">Offers · comparison · outcome</text>

  <rect class="feature" x="980" y="480" width="285" height="78" rx="12"/>
  <text class="label" x="1122" y="510" text-anchor="middle">Private messaging</text>
  <text class="small" x="1122" y="535" text-anchor="middle">Conversation for one offer</text>

  <rect class="group" x="275" y="625" width="1025" height="205" rx="18"/>
  <text class="groupLabel" x="305" y="658">CORE SINGLETON CAPABILITIES</text>

  <rect class="core" x="310" y="687" width="210" height="95" rx="12"/>
  <text class="label" x="415" y="718" text-anchor="middle">Auth state</text>
  <text class="small" x="415" y="742" text-anchor="middle">Token · linked profiles</text>
  <text class="small" x="415" y="763" text-anchor="middle">active role · presence</text>

  <rect class="core" x="555" y="687" width="250" height="95" rx="12"/>
  <text class="label" x="680" y="718" text-anchor="middle">Typed API clients</text>
  <text class="small" x="680" y="742" text-anchor="middle">Profiles · RFQs · offers</text>
  <text class="small" x="680" y="763" text-anchor="middle">market · messages · notifications</text>

  <rect class="cross" x="840" y="687" width="205" height="95" rx="12"/>
  <text class="label" x="942" y="718" text-anchor="middle">Availability circuit</text>
  <text class="small" x="942" y="742" text-anchor="middle">One outage state</text>
  <text class="small" x="942" y="763" text-anchor="middle">explicit readiness retry</text>

  <rect class="core" x="1080" y="687" width="185" height="95" rx="12"/>
  <text class="label" x="1172" y="718" text-anchor="middle">HTTP pipeline</text>
  <text class="small" x="1172" y="742" text-anchor="middle">Auth guard/interceptor</text>
  <text class="small" x="1172" y="763" text-anchor="middle">Angular HttpClient</text>

  <rect class="external" x="1390" y="405" width="175" height="100" rx="16"/>
  <text class="inverse" x="1477" y="444" text-anchor="middle">ASP.NET Core API</text>
  <text class="inverseSmall" x="1477" y="470" text-anchor="middle">REST and health</text>

  <path class="line" d="M188 455 H225"/>
  <path class="line" d="M787 280 V315"/>
  <path class="line" d="M787 590 V625"/>
  <path class="line" d="M805 734 H840"/>
  <path class="line" d="M520 734 V805 H942 V782"/>
  <path class="line" d="M1045 734 H1080"/>
  <path class="line" d="M1265 734 H1328 V455 H1390"/>

  <text class="small" x="205" y="430" text-anchor="middle">uses</text>
  <text class="small" x="1345" y="400" text-anchor="middle">/api · /health</text>
</svg>
